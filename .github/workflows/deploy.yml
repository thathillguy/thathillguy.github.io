name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Pages "deploy from a branch" mode serves the repo root, so keep the
      # built files there too. The commit carries [skip ci] and the job is
      # guarded against the bot's own push, so this cannot loop.
      - name: Publish build to repo root
        run: |
          rm -rf index.html assets favicon.svg resume.pdf
          cp -R dist/. .
          git add -A index.html assets favicon.svg resume.pdf
          if git diff --cached --quiet; then
            echo "root already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish site to root [skip ci]"
          git push

      # Pages "GitHub Actions" mode deploys this artifact instead.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
